<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>假说库</title>
<link rel="stylesheet" href="theme.css">
<style>
  header { padding:20px 28px 8px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--ink-light); font-size:13px; margin-bottom:14px; }
  main { max-width:1180px; margin:0 auto; padding:0 28px 60px; display:flex; gap:20px; }
  #list { width:320px; flex-shrink:0; }
  #list .item { padding:10px 14px; border:1px solid var(--line); border-radius:8px;
                background:var(--card); margin-bottom:8px; cursor:pointer; font-size:14px; }
  #list .item:hover { border-color:var(--gold); }
  #list .item.active { border-color:var(--gold); background:var(--panel); }
  #content { flex:1; min-width:0; }
  .md { background:var(--card); border:1px solid var(--line); border-radius:10px;
        padding:24px 32px; line-height:1.85; font-size:14.5px; }
  .md h1 { font-size:20px; border-bottom:1px solid var(--line); padding-bottom:8px; }
  .md h2 { font-size:16.5px; color:var(--gold-deep); margin:22px 0 8px; }
  .md h3 { font-size:15px; margin:16px 0 6px; }
  .md p, .md li { color:var(--ink); }
  .md ul, .md ol { padding-left:24px; }
  .md blockquote { border-left:3px solid var(--line); margin:10px 0; padding:4px 16px;
                   color:var(--ink-light); background:var(--panel); border-radius:0 8px 8px 0; }
  .md code { background:var(--panel); padding:1px 6px; border-radius:4px; font-size:13px; }
  .md table { border-collapse:collapse; width:100%; margin:10px 0; font-size:13px; }
  .md th, .md td { border:1px solid var(--line); padding:6px 10px; text-align:left; }
  .md th { background:var(--panel2); }
  .md hr { border:none; border-top:1px solid var(--line); margin:18px 0; }
  .md mark { background:var(--mark-bg); padding:0 3px; border-radius:3px; }
  .empty { color:var(--ink-light); }
  @media (max-width: 800px) { main { flex-direction:column; } #list { width:100%; } }
</style>
</head>
<body>
<nav id="zg-nav">
  <span class="brand">原神资料库 v3</span>
  <a href="index.html" data-p="home">检索</a>
  <a href="browse.html" data-p="browse">章节浏览</a>
  <a href="timeline.html" data-p="timeline">时间线</a>
  <a href="kg.html" data-p="kg">知识层</a>
  <a href="archive.html" data-p="archive">档案库</a>
  <a href="hypothesis.html" data-p="hypo">假说库</a>
  <a href="arbitration.html" data-p="arb">仲裁</a>
</nav>
<script>
(function(){
  var path = location.pathname;
  var cur = path === "/" || path === "/index.html" ? "home"
          : path.includes("browse") ? "browse"
          : path.includes("timeline") ? "timeline"
          : path.includes("kg") ? "kg"
          : path.includes("archive") ? "archive"
          : path.includes("hypothesis") ? "hypo"
          : path.includes("arbitration") ? "arb" : "";
  var a = document.querySelector('#zg-nav a[data-p="'+cur+'"]');
  if (a) a.classList.add("cur");
})();
</script>

<header>
  <h1>假说库</h1>
  <div class="sub">社区考据假说的公开验证记录——每条假说附原文证据与核实结论；证实者迁入时间线，证伪者标注留档。<b>欢迎提交你的假说</b>（页面底部）</div>
</header>
<main>
  <div id="hlist"></div>
  <div id="submit-box" class="card" style="margin-top:22px; text-align:center; padding:18px;">
    <div style="font-size:14px; margin-bottom:8px;">有新的考据假说？</div>
    <a class="btn" style="display:inline-block; text-decoration:none; padding:8px 22px;"
       href="https://github.com/genshin-archive/genshin-text/issues/new?template=hypothesis.md"
       target="_blank" rel="noopener">提交假说（GitHub Issue）</a>
    <div style="font-size:12px; color:var(--ink-light); margin-top:8px;">提交时会引导你附上：假说内容 / 游戏内原文出处 / 推理链</div>
  </div>
</main>
<script>
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
const HSTATUS = {
  "pending":  { zh: "待验证", cls: "hs-pending" },
  "verifying":{ zh: "验证中", cls: "hs-verifying" },
  "confirmed":{ zh: "已证实", cls: "hs-confirmed" },
  "refuted":  { zh: "已证伪", cls: "hs-refuted" },
  "partial":  { zh: "部分证实", cls: "hs-partial" }
};
fetch("hypotheses.json").then(r=>r.json()).then(data=>{
  const items = data.items || [];
  const box = document.getElementById("hlist");
  if (!items.length) {
    box.innerHTML = '<div class="card" style="text-align:center; color:var(--ink-light); padding:40px;">' +
      '假说库已开放——目前尚无收录的社区假说。<br>第一条可能就是你提交的。</div>';
    return;
  }
  box.innerHTML = items.map(it=>{
    const st = HSTATUS[it.status] || HSTATUS.pending;
    const ev = (it.evidence || []).map(e=>
      `<div class="h-ev"><div class="h-src">${esc(e.source || "")}</div><blockquote>${esc(e.quote || "")}</blockquote></div>`).join("");
    const log = (it.verify_log || []).map(l=>
      `<div class="h-log"><span class="h-date">${esc(l.date || "")}</span>${esc(l.note || "")}</div>`).join("");
    return `<div class="card h-item">
      <div class="h-head">
        <span class="h-title">${esc(it.title || "")}</span>
        <span class="h-badge ${st.cls}">${st.zh}</span>
      </div>
      <div class="h-body">${esc(it.summary || "")}</div>
      ${ev ? `<details class="h-fold"><summary>证据与验证记录</summary>${ev}${log ? `<div class="h-logs">${log}</div>` : ""}</details>` : ""}
      <div class="h-meta">${it.author ? `提交者：${esc(it.author)} · ` : ""}${it.created ? `收录于 ${esc(it.created)}` : ""}${it.issue ? ` · <a href="${esc(it.issue)}" target="_blank" rel="noopener">原始 Issue</a>` : ""}</div>
    </div>`;
  }).join("");
}).catch(()=>{
  document.getElementById("hlist").innerHTML = '<div class="card" style="text-align:center; color:var(--ink-light); padding:40px;">假说数据加载失败</div>';
});
</script>
<style>
  .h-item { padding:16px 20px; margin-bottom:12px; }
  .h-head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .h-title { font-size:15.5px; font-weight:600; color:var(--ink); }
  .h-badge { font-size:11.5px; padding:2px 10px; border-radius:12px; font-family:var(--sans); border:1px solid; }
  .hs-pending { background:#e8e4d8; color:#6a7186; border-color:#d5d0c2; }
  .hs-verifying { background:#f5ecd6; color:#92702a; border-color:#e2d2a6; }
  .hs-confirmed { background:#e0f0e8; color:#3a8a5a; border-color:#c0dccd; }
  .hs-refuted { background:#f6dcdc; color:#a03030; border-color:#e2bcbc; }
  .hs-partial { background:#dde8f5; color:#4a6a9a; border-color:#c0d2e6; }
  .h-body { font-size:13.5px; color:var(--ink); margin-top:8px; line-height:1.8; }
  .h-fold { margin-top:10px; }
  .h-fold > summary { list-style:none; cursor:pointer; display:inline-flex; align-items:center;
    font-family:var(--sans); font-size:12px; color:var(--ink-light);
    padding:2px 10px; border:1px solid var(--line); border-radius:14px; }
  .h-fold > summary::before { content:"▸"; margin-right:5px; transition:transform .15s; }
  .h-fold[open] > summary::before { transform:rotate(90deg); }
  .h-fold[open] > summary { margin-bottom:8px; }
  .h-ev { margin:10px 0; }
  .h-src { font-size:12px; color:var(--ink-light); margin-bottom:3px; }
  .h-ev blockquote { border-left:3px solid var(--gold); background:rgba(200,164,92,.06);
    padding:6px 12px; margin:0; border-radius:0 8px 8px 0; font-size:13px; color:var(--gold-deep); }
  .h-logs { margin-top:10px; border-top:1px dashed var(--line); padding-top:8px; }
  .h-log { font-size:12.5px; color:var(--ink); margin:5px 0; }
  .h-date { color:var(--ink-light); margin-right:8px; font-family:var(--sans); }
  .h-meta { font-size:12px; color:var(--ink-light); margin-top:10px; }
</style>
</body>
</html>
