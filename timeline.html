<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>提瓦特多轴时间线</title>
<link rel="stylesheet" href="theme.css">
<style>
  header { padding:20px 28px 8px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--ink-light); font-size:13px; margin-bottom:14px; }
  main { padding:0 28px 60px; max-width:1280px; margin:0 auto; }
  .axis { background:var(--card); border:1px solid var(--line); border-radius:10px;
          margin-bottom:18px; overflow:hidden; }
  .axis-head { padding:12px 18px; background:var(--panel); border-bottom:1px solid var(--line);
               display:flex; align-items:baseline; gap:10px; }
  .axis-head h2 { font-size:16px; margin:0; color:var(--gold-deep); }
  .axis-head .desc { color:var(--ink-light); font-size:12.5px; }
  .evs { padding:8px 14px 14px 34px; position:relative; }
  .evs::before { content:""; position:absolute; left:14px; top:20px; bottom:20px;
                 width:2px; background:var(--line-strong); border-radius:2px; }
  .ev { position:relative; border:1px solid var(--line); border-radius:8px; background:var(--card);
        margin:12px 0; padding:10px 14px; }
  .ev::before { content:""; position:absolute; left:-25px; top:17px; width:9px; height:9px;
                border-radius:50%; background:var(--gold);
                box-shadow:0 0 0 3px var(--bg), 0 0 0 4px var(--line-strong); }
  .ev:hover { border-color:var(--gold); }
  .ev-title { font-weight:600; font-size:14.5px; display:flex; align-items:center;
              flex-wrap:wrap; gap:8px; }
  .ev-book { font-size:12px; color:var(--ink-light); font-weight:400; font-family:var(--sans); }
  .badge { font-size:11px; padding:1px 8px; border-radius:10px; border:1px solid; white-space:nowrap; font-family:var(--sans); }
  .b-mingwen { color:#4a6a9a; border-color:#c0d2e6; background:#dde8f5; }
  .b-huiyi { color:#6a4a9a; border-color:#d4c4e6; background:#ece4f5; }
  .b-yuyan { color:#92702a; border-color:#e2d2a6; background:#f5ecd6; }
  .b-gaixie, .b-daoliu { color:#a04a72; border-color:#e2c0d2; background:#f6e0ea; }
  .b-tuiyan { color:#6a7186; border-color:#d5d0c2; background:#e8e4d8; }
  .b-yingyan { color:#3a8a5a; border-color:#c0dccd; background:#e0f0e8; }
  .b-maodun { color:#a03030; border-color:#e2bcbc; background:#f6dcdc; }
  .pos { font-size:12px; color:var(--gold-deep); background:rgba(200,164,92,.12);
         padding:1px 8px; border-radius:8px; }
  .ev-detail { font-size:13px; color:var(--ink); margin-top:6px; line-height:1.7; }
  .ev-sum { font-size:13px; color:var(--ink); margin-top:5px; line-height:1.7; opacity:.92; }
  .ev-more { margin-top:7px; }
  .ev-more > summary {
    list-style:none; cursor:pointer; display:inline-flex; align-items:center;
    font-family:var(--sans); font-size:12px; color:var(--ink-light);
    padding:2px 10px; border:1px solid var(--line); border-radius:14px;
  }
  .ev-more > summary:hover { border-color:var(--gold); color:var(--gold-deep); }
  .ev-more > summary::before { content:"▸"; margin-right:5px; transition:transform .15s; }
  .ev-more[open] > summary::before { transform:rotate(90deg); }
  .ev-more[open] > summary { margin-bottom:6px; }
  .ev-quote {
    font-size:13px; color:var(--gold-deep); font-style:italic; line-height:1.8;
    border-left:3px solid var(--gold); background:rgba(200,164,92,.06);
    padding:6px 12px; margin:6px 0; border-radius:0 8px 8px 0;
  }
  .ev-src { font-size:12px; color:var(--ink-light); margin-top:5px; }
  .ev-src::before { content:"出处："; }
  .ev-evidence { font-size:12px; color:var(--ink-light); margin-right:10px; }
  section h2 { font-size:17px; margin:28px 0 10px; }
  table { width:100%; border-collapse:collapse; background:var(--card);
          border:1px solid var(--line); border-radius:8px; overflow:hidden; font-size:13px; }
  th, td { padding:8px 12px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  tr:last-child td { border-bottom:none; }
  .rel { display:inline-block; margin:3px 6px 3px 0; padding:2px 10px; border-radius:6px;
         font-size:12.5px; background:var(--panel); border:1px solid var(--line); }
  .rel.maodun { border-color:#e2bcbc; color:#a03030; }
  .rel.yingyan { border-color:#c0dccd; color:#3a8a5a; }
  .rel b { font-weight:600; }
  .links-box { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 18px; }
  .loading { color:var(--ink-light); padding:40px; text-align:center; }
  :root { --dim: var(--ink-light); --border: var(--line); --panel: var(--card); --text: var(--ink); }
</style>
</head>
<body>
<nav id="zg-nav">
  <span class="brand">原神资料库 v3</span>
  <a href="index.html" data-p="home">检索</a>
  <a href="browse.html" data-p="browse">章节浏览</a>
  <a href="timeline.html" data-p="timeline">时间线</a>
  <a href="kg.html" data-p="kg">知识层</a>
  <a href="archive.html" data-p="archive">档案库</a>
  <a href="hypothesis.html" data-p="hypo">假说库</a>
  
</nav>
<script>
(function(){
  var path = location.pathname;
  var cur = path === "/" || path === "/index.html" ? "home"
          : path.includes("browse") ? "browse"
          : path.includes("timeline") ? "timeline"
          : path.includes("kg") ? "kg"
          : path.includes("archive") ? "archive"
          : path.includes("hypothesis") ? "hypo"

  var a = document.querySelector('#zg-nav a[data-p="'+cur+'"]');
  if (a) a.classList.add("cur");

<header>
  <h1>提瓦特多轴时间线</h1>
  <div class="sub">多轴结构：非线性时间以「轴」表达——每条事件可挂多轴；叙事模式逐条标注；矛盾对显式列出。</div>
</header>
<main id="app"><div class="loading">加载中…</div></main>

<script>
const MODE_BADGE = {
  "明文":"b-mingwen","明文·双记载":"b-maodun","明文·时点未明":"b-mingwen",
  "明文·悬案":"b-maodun","回忆":"b-huiyi","预言·应验":"b-yingyan",
  "明文+推演":"b-tuiyan","推演":"b-tuiyan","改写":"b-gaixie","倒流":"b-gaixie",
  "叠加":"b-gaixie","存疑":"b-tuiyan","状态标注":"b-tuiyan"
};
function badge(mode){
  let cls = MODE_BADGE[mode];
  if (!cls) {  // 复合模式（如"明文·回忆"）按关键词回退
    for (const k in MODE_BADGE) {
      if (mode.split("·").some(p => k === p)) { cls = MODE_BADGE[k]; break; }
    }
  }
  return `<span class="badge ${cls || "b-tuiyan"}">${mode}</span>`;
}
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function md(s){ return esc((s||"").replace(/\*{3,}/g, "**")).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\*([^*]+)\*/g,"<i>$1</i>"); }
// 叙述模式与出处拆分：「明文·《日月前事》」→ 模式=明文，出处=《日月前事》
function splitMode(mode){
  const parts = (mode || "明文").split("·");
  const mParts = [], srcs = [];
  parts.forEach(p => {
    const t = p.trim();
    (/^《.*》$/.test(t) ? srcs : mParts).push(t);
  });
  return {m: mParts.join("·") || "明文", src: srcs.join("、")};
}
const PUNCT_TAIL = /[\s。；，、：:！？!?…—\-·]+$/;
function trimPunct(s){ return (s||"").replace(PUNCT_TAIL, "").trim(); }
function parenBalanced(s){
  let d = 0;
  for (const c of s) { if (c === "（" || c === "(") d++; if (c === "）" || c === ")") d--; }
  return d === 0;
}

// 精炼提取：自然切分（冒号前缀 > 首句 > 破折号 > 分号），**绝不硬截、不产生省略号**。
// 切分点必须括号平衡；切不动的整段做标题，全文放折叠区——宁可标题长，不要烂截断。
function splitHead(raw){
  let s = (raw || "").replace(/\*{3,}/g, "").replace(/\*\*/g, "").trim();
  if (!s) return {head: "", rest: ""};
  s = s.replace(/^【v[^】]*】\s*/, "");        // 剥离内部版本标注前缀（【v1.7 明文】等）
  s = s.replace(/【[^】]*】\s*$/, "").trim();  // 尾部引文标记（badge 已展示）
  let m = s.match(/^([^：:]{2,26})[：:]/);
  if (m && parenBalanced(m[1])) return {head: trimPunct(m[1]), rest: s.slice(m[0].length).trim()};
  m = s.match(/^([\s\S]{2,}?)[。！？]([\s\S]*)$/);
  if (m && m[1].length <= 56 && parenBalanced(m[1])) return {head: trimPunct(m[1]), rest: m[2].trim()};
  const di = s.indexOf("——");
  if (di >= 2 && di <= 40 && s.length - di - 2 >= 12 && parenBalanced(s.slice(0, di))) {
    return {head: trimPunct(s.slice(0, di)), rest: s.slice(di + 2).trim()};
  }
  m = s.match(/^([^；;]{4,40})[；;]/);
  if (m && parenBalanced(m[1])) return {head: trimPunct(m[1]), rest: s.slice(m[0].length).trim()};
  return {head: trimPunct(s), rest: ""};
}

fetch("data/kg_timeline.json").then(r=>r.json()).then(eras=>{
  // v3 结构化时间线：8 纪元 / 161 节点（kg_eras + kg_timeline_nodes）
  // 节点结构（三层冗余已消除）：
  //   标题行 = 自然切出的纯文本标题（不截断、无省略号）+ 模式徽章 + 出处小字
  //   折叠区 = 标题之外的正文 + 引文 + 出处（没有额外内容就不显示折叠入口）
  let html = "";
  eras.forEach(e=>{
    html += `<div class="axis"><div class="axis-head"><h2>${esc(e.era.name)}</h2>
             <span class="desc">${e.nodes.length} 个节点 · 源自 ${esc(e.era.source||"timeline.md")}</span></div><div class="evs">`;
    if (!e.nodes.length) html += `<div class="ev-detail" style="color:var(--dim)">（此纪元暂无节点）</div>`;
    e.nodes.forEach(n=>{
      const t = splitHead(n.title);
      const d = (n.detail && n.detail !== n.title) ? (n.detail.replace(/\*{3,}/g,"").replace(/\*\*/g,"").replace(/【[^】]*】\s*$/,"").trim()) : "";
      const rest = [t.rest, d].filter(Boolean).join("\n");
      const mode = splitMode(n.narrative_mode);
      const needFold = !!rest || !!n.quote || !!n.source;
      html += `<div class="ev">
        <div class="ev-title">${md(t.head)} ${badge(mode.m)}${mode.src ? ` <span class="ev-book">${esc(mode.src)}</span>` : ""}</div>
        ${needFold ? `<details class="ev-more"><summary>原文与出处</summary>
          ${n.quote ? `<div class="ev-quote">「${md(n.quote)}」</div>` : ""}
          ${rest ? `<div class="ev-detail">${md(rest)}</div>` : ""}
          ${n.source ? `<div class="ev-src"><span class="ev-evidence">${esc(n.source)}</span>${mode.src ? "" : (n.narrative_mode==="明文"?"":"（叙述模式：" + esc(n.narrative_mode) + "）")}</div>` : ""}
        </details>` : ""}
      </div>`;
    });
    html += `</div></div>`;
  });
  document.getElementById("app").innerHTML = html || "<p style='color:var(--dim)'>时间线数据为空</p>";
}).catch(err=>{
  document.getElementById("app").innerHTML = "<p style='color:#ef7c8c'>加载失败: "+err+"</p>";
});
</script>
</body>
</html>
